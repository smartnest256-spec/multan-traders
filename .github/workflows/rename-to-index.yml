name: Rename site file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file and push
        run: |
          if [ -f multan-index-with-pixel.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git mv multan-index-with-pixel.html index.html
            git commit -m "Rename site file to index.html"
            git push
          fi
